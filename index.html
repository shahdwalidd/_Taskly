<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Iconlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TASKLY</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const recoveryParams = new URLSearchParams(window.location.hash.slice(1))
      const recoveryToken = recoveryParams.get('access_token')

      if (recoveryParams.get('type') === 'recovery' && recoveryToken) {
        sessionStorage.setItem('taskly_recovery_access_token', recoveryToken)
        window.history.replaceState(null, '', window.location.pathname)
        window.location.replace('/reset-password')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
